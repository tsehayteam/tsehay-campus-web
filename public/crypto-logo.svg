<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#14F195" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>
    <linearGradient id="ethGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#627EEA" />
      <stop offset="100%" stop-color="#3B5998" />
    </linearGradient>
    <linearGradient id="btcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#F7931A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. Bitcoin (BTC) -->
  <g transform="translate(42, 45)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="32" fill="url(#btcGrad)" />
    <!-- Inner subtle ring -->
    <circle cx="0" cy="0" r="29" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
    <path d="M 4 -18 L 4 -13 C 6.5 -12.5 8.5 -11.5 10 -9.5 C 11.5 -7.5 12 -5 12 -2 C 12 1.5 10.5 4.2 8 5.5 C 11.2 7 12.8 10 12.8 14 C 12.8 17.5 11.5 20.5 9 22.5 C 7 24 4.5 24.8 1.5 25 L 1.5 30 L -3.5 30 L -3.5 25 L -7 25 L -7 30 L -12 30 L -12 25 L -18 25 L -18 20 L -13 20 L -13 -13 L -18 -13 L -18 -18 L -12 -18 L -12 -23 L -7 -23 L -7 -18 L -3.5 -18 L -3.5 -23 L 1.5 -23 L 1.5 -18 L 4 -18 Z M -7 -13 L -7 1.5 L 0.5 1.5 C 2.5 1.5 4 1 5 -0.2 C 6 -1.2 6.5 -2.5 6.5 -4.2 C 6.5 -6 6 -7.2 5 -8.2 C 4 -9.2 2.5 -9.6 0.5 -9.6 L -7 -9.6 L -7 -13 Z M -7 6.5 L -7 20 L 1.8 20 C 4 20 5.8 19.5 7 18.2 C 8.2 17 8.8 15.2 8.8 13.2 C 8.8 11.2 8.2 9.5 7 8.2 C 5.8 7 4 6.5 1.8 6.5 L -7 6.5 Z" fill="#FFFFFF" transform="scale(0.7) translate(3, -3)"/>
  </g>

  <!-- 2. Ethereum (ETH) -->
  <g transform="translate(160, 45)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="32" fill="url(#ethGrad)" />
    <!-- Inner subtle ring -->
    <circle cx="0" cy="0" r="29" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
    <g transform="translate(0, 0) scale(1.15)">
      <!-- Top Left -->
      <polygon points="0,-18 -11,1 0,6" fill="#FFFFFF" fill-opacity="0.9" />
      <!-- Top Right -->
      <polygon points="0,-18 11,1 0,6" fill="#FFFFFF" fill-opacity="0.65" />
      <!-- Bottom Left -->
      <polygon points="0,8 -11,3 0,18" fill="#FFFFFF" fill-opacity="0.9" />
      <!-- Bottom Right -->
      <polygon points="0,8 11,3 0,18" fill="#FFFFFF" fill-opacity="0.65" />
    </g>
  </g>

  <!-- 3. Solana (SOL) -->
  <g transform="translate(278, 45)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="32" fill="#0A0B0D" />
    <!-- Outer Solana border -->
    <circle cx="0" cy="0" r="31" fill="none" stroke="url(#solanaGrad)" stroke-width="2.5" />
    <g transform="translate(-15, -13) scale(1.4)">
      <!-- Top Bar -->
      <path d="M3.2 0.3 C3.4 0.1 3.7 0 4.0 0 L20.8 0 C21.4 0 21.7 0.7 21.3 1.1 L18.6 3.8 C18.4 4.0 18.1 4.1 17.8 4.1 L1.0 4.1 C0.4 4.1 0.1 3.4 0.5 3.0 L3.2 0.3 Z" fill="url(#solanaGrad)" />
      <!-- Middle Bar (reversed) -->
      <path d="M18.6 7.4 C18.4 7.2 18.1 7.1 17.8 7.1 L1.0 7.1 C0.4 7.1 0.1 7.8 0.5 8.2 L3.2 10.9 C3.4 11.1 3.7 11.2 4.0 11.2 L20.8 11.2 C21.4 11.2 21.7 10.5 21.3 10.1 L18.6 7.4 Z" fill="url(#solanaGrad)" />
      <!-- Bottom Bar -->
      <path d="M3.2 14.5 C3.4 14.3 3.7 14.2 4.0 14.2 L20.8 14.2 C21.4 14.2 21.7 14.9 21.3 15.3 L18.6 18.0 C18.4 18.2 18.1 18.3 17.8 18.3 L1.0 18.3 C0.4 18.3 0.1 17.6 0.5 17.2 L3.2 14.5 Z" fill="url(#solanaGrad)" />
    </g>
  </g>
</svg>
