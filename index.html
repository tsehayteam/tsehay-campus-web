<!DOCTYPE html>
<html lang="am" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ጥገና ላይ ነን - Tsehay Campus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Noto+Sans+Ethiopic:wght@400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans Ethiopic', 'Montserrat', sans-serif; 
            background-color: #0f172a; 
            color: white; 
        }
        .glow-effect {
            position: absolute; 
            width: 400px; 
            height: 400px; 
            background: #F9B03C;
            border-radius: 50%; 
            filter: blur(150px); 
            opacity: 0.15; 
            z-index: -1;
        }
        .glow-blue {
            background: #3268BA;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Background Glow Effects -->
    <div class="glow-effect top-[-10%] left-[-10%] animate-pulse" style="animation-duration: 4s;"></div>
    <div class="glow-effect glow-blue bottom-[-10%] right-[-10%] animate-pulse" style="animation-duration: 5s;"></div>

    <!-- Main Card -->
    <div class="max-w-lg w-full bg-[#1e293b]/60 backdrop-blur-2xl border border-slate-700/50 p-8 md:p-12 rounded-[2.5rem] shadow-2xl text-center z-10 relative">
        
        <!-- 💡 Icon/Logo Area (ተስተካክሏል) -->
        <div class="w-28 h-28 bg-white rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-[0_0_30px_rgba(255,255,255,0.1)] border border-slate-600 p-2 relative overflow-hidden group">
            <img src="Campus Logo.jpg" alt="Tsehay Campus Logo" class="w-full h-full object-contain rounded-2xl relative z-10" onerror="this.src='https://ui-avatars.com/api/?name=TC&background=0f172a&color=fff'">
        </div>

        <h1 class="text-3xl md:text-4xl font-black mb-4 text-white tracking-tight">
            ጥገና ላይ <span class="text-[#F9B03C]">ነን</span>
        </h1>
        
        <p class="text-slate-400 mb-8 text-base md:text-lg leading-relaxed">
            Tsehay Campus ይበልጥ የተሻለ እና ፈጣን አገልግሎት እንዲሰጥዎ የማሻሻያ ስራዎች እየተከናወኑ ነው። በቅርቡ እንመለሳለን!
        </p>

        <!-- Interactive Notify Form -->
        <div id="notify-section" class="space-y-4">
            <input type="text" id="userName" placeholder="ስምዎን ያስገቡ..." class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-white focus:outline-none focus:border-[#F9B03C] transition shadow-inner">
            
            <button onclick="handleNotify()" class="w-full bg-[#F9B03C] text-black font-black py-4 rounded-xl hover:bg-yellow-400 transition-all shadow-[0_0_20px_rgba(249,176,60,0.2)] hover:shadow-[0_0_25px_rgba(249,176,60,0.4)] transform hover:-translate-y-1 flex justify-center items-center gap-2">
                ሲከፈት አሳውቁኝ <i class="fa-solid fa-bell"></i>
            </button>
        </div>

        <!-- Success Message (Hidden by default) -->
        <div id="success-msg" class="hidden py-6 animate-[fadeIn_0.5s_ease-out]">
            <div class="w-16 h-16 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-check-circle"></i>
            </div>
            <h2 class="text-2xl font-black text-white mb-2">ተሳክቷል!</h2>
            <p class="text-green-400 font-bold" id="thankYouText"></p>
        </div>

        <!-- Contact Support Line -->
        <div class="mt-10 pt-8 border-t border-slate-700/50">
            <p class="text-xs text-slate-500 uppercase tracking-widest font-bold mb-3">ለድጋፍ እና ጥያቄ</p>
            <a href="tel:+251980209090" class="inline-block text-2xl md:text-3xl font-black text-white hover:text-[#F9B03C] transition-colors">
                <i class="fa-solid fa-phone text-[#F9B03C] text-xl mr-2"></i> 0980 20 90 90
            </a>
            <p class="text-sm text-slate-400 mt-3 font-bold">— Tsehay Team</p>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        function handleNotify() {
            const nameInput = document.getElementById('userName');
            const name = nameInput.value.trim();
            
            if (!name) {
                nameInput.classList.add('border-red-500');
                nameInput.placeholder = "እባክዎ ስምዎን ያስገቡ!";
                return;
            }
            
            // Hide form and show success message
            document.getElementById('notify-section').style.display = 'none';
            const successMsg = document.getElementById('success-msg');
            successMsg.classList.remove('hidden');
            document.getElementById('thankYouText').innerText = `እናመሰግናለን ${name}! ዌብሳይቱ ሲከፈት በፍጥነት እናሳውቅዎታለን።`;
        }
    </script>
</body>
</html>
