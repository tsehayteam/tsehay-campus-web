<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - Tsehay Campus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0f0f12] text-white min-h-screen flex items-center justify-center p-4">

    <!-- Maintenance Container -->
    <div class="w-full max-w-sm bg-[#1a1a1f] p-10 rounded-[32px] shadow-2xl border border-white/5 text-center">
        
        <!-- Icon -->
        <div class="w-20 h-20 bg-orange-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </div>

        <!-- Text -->
        <h1 class="text-2xl font-bold text-white mb-3">Under Maintenance</h1>
        <p class="text-gray-400 text-sm leading-relaxed mb-8">
            Tsehay Campus is currently getting an upgrade. We're working hard to make your experience even better. Please check back shortly.
        </p>

        <!-- Status Pill -->
        <div class="inline-block bg-[#25252b] px-4 py-2 rounded-full border border-white/10">
            <span class="text-xs font-semibold text-orange-400 uppercase tracking-widest">Back soon</span>
        </div>
    </div>

</body>
</html>
